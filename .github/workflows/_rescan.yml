---
name: Container Rescan

# Verify and rescan published SPDX attestations without pulling image layers.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      image-tag:
        description: Published image tag (latest, develop, edge, or a specific tag)
        type: string
        required: true
        default: latest

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Rescan ${{ matrix.image }} (${{ matrix.arch }}, ${{ inputs.image-tag || 'latest' }})
    permissions:
      contents: read
      packages: read
      attestations: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [weewx, weewx-rtldavis]
        arch: [amd64, arm64]
    uses: cdavis289/reusable-workflows/.github/workflows/container-rescan.yml@1beb91ac8b97c3b17ce0fc02775b73dc1d4504c8
    with:
      image-name: cdavis289/${{ matrix.image }}
      arch: ${{ matrix.arch }}
      tag: ${{ inputs.image-tag || 'latest' }}
      signer-workflow: cdavis289/reusable-workflows/.github/workflows/container-build.yml
