---
name: Check for RTL-Davis updates

on:
  workflow_dispatch:
  schedule:
    - cron: "37 11 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check RTL-Davis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # tag=v7.0.0
        with:
          ref: develop
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: Get current and latest production releases
        id: versions
        shell: bash
        run: |
          set -Eeuo pipefail

          current="$(sed -n 's/^ARG RTL_DAVIS_RELEASE=//p' Dockerfile.rtldavis)"
          test -n "${current}"

          latest="$(./update-rtldavis --latest)"

          if [[ -z "${latest}" ]]; then
            echo "No approved production releases found."
            latest="${current}"
          fi

          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

          echo "Current release: ${current}"
          echo "Latest release: ${latest}"

      - name: Verify currently pinned release
        if: steps.versions.outputs.current != 'unreleased'
        env:
          CURRENT_RELEASE: ${{ steps.versions.outputs.current }}
        run: ./update-rtldavis "$CURRENT_RELEASE"

      - name: Update RTL-Davis
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        env:
          LATEST_RELEASE: ${{ steps.versions.outputs.latest }}
        run: ./update-rtldavis "$LATEST_RELEASE"

      - name: Validate updated driver
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        run: |
          python3 -m py_compile test-assets/rtldavis/rtldavis*.py
          git diff --check
          python3 tools/test-rtldavis-updater.py
          python3 tools/validate-rtldavis.py

      - name: Build RTL-Davis image
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        run: |
          docker build \
            -f Dockerfile.rtldavis \
            -t weewx-rtldavis:update-test \
            .

      - name: Verify RTL-Davis image
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        run: |
          bash tools/test-rtldavis-image.sh weewx-rtldavis:update-test

      - name: Create update pull request
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          NEW_VERSION: ${{ steps.versions.outputs.latest }}
          OLD_VERSION: ${{ steps.versions.outputs.current }}
        shell: bash
        run: |
          set -Eeuo pipefail

          branch="automation/rtldavis-${NEW_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin

          git checkout -B "${branch}"

          git add Dockerfile.rtldavis test-assets/rtldavis/
          git commit -m "Update RTL-Davis to ${NEW_VERSION}"
          git push --force-with-lease origin "${branch}"

          existing="$(
            gh pr list \
              --head "${branch}" \
              --base develop \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "${existing}" ]]; then
            echo "Pull request #${existing} already exists."
            exit 0
          fi

          gh pr create \
            --base develop \
            --head "${branch}" \
            --title "Update RTL-Davis to ${NEW_VERSION}" \
            --body "Automated custom production RTL-Davis update from ${OLD_VERSION} to ${NEW_VERSION}.

          Validation completed before creating this PR:

          - custom production release and pinned commit verified
          - Python driver version verified
          - hardware_name customization preserved
          - Python syntax validated
          - RTL-Davis Docker image built successfully
          - installed driver version verified

          Review and approve before merging. No automatic deployment."
